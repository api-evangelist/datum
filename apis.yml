aid: datum
name: Datum
description: >-
  Datum is an open source network cloud built for AI, founded in 2024 and backed
  by $13.6M from Amplify Partners, CRV, Encoded Ventures, Cervin Ventures,
  Ex/Ante, Step Function, and Vine Ventures, and founded by Zac Smith and Jacob
  Smith (ex-Equinix, Packet). Datum gives AI-native developers and alternative
  cloud providers critical, neutral network infrastructure to compete at scale:
  an Envoy-based AI Edge with a Coraza OWASP WAF, Layer 7 HTTPProxy/HTTPRoute
  traffic management, authoritative DNS and programmatic domain management,
  QUIC-based secure tunnels (Connectors) powered by Iroh, and a Galactic VPC
  global backbone, all deployed across 17+ global network locations. The platform
  is exposed through a Kubernetes-style declarative control-plane API at
  api.datum.net, the datumctl CLI, an official MCP server, and packaged agent
  Skills, with OAuth 2.0 / OIDC authentication and a forever-free Builder tier.
  Core platform is licensed AGPLv3.
