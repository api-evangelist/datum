apis:
- name: Datum Cloud API
  description: >-
    Kubernetes-style declarative control-plane API for managing Datum Cloud
    resources — projects, domains, DNS zones and record sets, gateways,
    HTTPProxies, HTTPRoutes, traffic protection policies (WAF), and
    organization/user membership. Authenticated with OAuth 2.0 / OIDC bearer
    tokens or service-account credentials; the surface is also reachable via the
    datumctl CLI, the official MCP server, and kubectl/Helm/Terraform through an
    exec-credential kubeconfig.
